apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  # Bez spec.tls: TLS kończy Cloudflare, a przekierowanie www robi nginx.
  rules:
    {{- range concat (list .Values.canonicalHost) .Values.redirectHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: 80
    {{- end }}
