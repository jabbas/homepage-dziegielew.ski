apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homepage.labels" . | nindent 8 }}
      annotations:
        # Zmiana treści strony lub konfiguracji nginx wywołuje rolling update.
        checksum/site: {{ include (print $.Template.BasePath "/configmap-site.yaml") . | sha256sum }}
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "homepage.selectorLabels" . | nindent 14 }}
      containers:
        - name: nginx
          image: {{ include "homepage.image" . }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Całe katalogi, nie subPath — subPath nie dostaje aktualizacji ConfigMapy.
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx-unprivileged trzyma w /tmp plik pid i pliki tymczasowe.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: site
          configMap:
            name: {{ .Release.Name }}-site
        - name: nginx
          configMap:
            name: {{ .Release.Name }}-nginx
        - name: tmp
          emptyDir: {}
