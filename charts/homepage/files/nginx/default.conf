# Plik przechodzi przez `tpl` (templates/configmap-nginx.yaml), więc używa
# .Values.canonicalHost i .Values.redirectHosts.
#
# Uwaga: `add_header` w bloku `location` kasuje wszystkie nagłówki odziedziczone
# z poziomu `server`. Dlatego nagłówki bezpieczeństwa są tylko na poziomie
# `server`, a w `location` nie ma żadnego `add_header` (Cache-Control idzie
# przez `expires`). Test: tests/nginx-smoke-test.sh.

# Blok domyślny: adres kanoniczny oraz wszystko, co nie pasuje do innego bloku
# (m.in. sondy kubeleta, które wysyłają `Host: <IP poda>`).
server {
    listen 8080 default_server;
    server_name {{ .Values.canonicalHost }};

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Bez tego nginx budowałby Location z http:// i portem 8080.
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Nazwy plików nie mają odcisków treści, więc cache jest krótki (Cache-Control: max-age=3600).
    expires 1h;

    error_page 404 /404.html;

    location = /cv {
        try_files /cv.html =404;
    }

    location = /cv/ {
        return 301 /cv;
    }

    location = /cv.html {
        return 301 /cv;
    }

    location = /404.html {
        internal;
    }

    location = /healthz {
        access_log off;
        return 200;
    }
}

# Hosty przekierowywane na adres kanoniczny (HTTPS zapewnia Cloudflare).
server {
    listen 8080;
    server_name {{ join " " .Values.redirectHosts }};

    server_tokens off;
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    expires 1h;

    return 301 https://{{ .Values.canonicalHost }}$request_uri;
}
